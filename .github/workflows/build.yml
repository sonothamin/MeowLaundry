name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already ships a full Android SDK (platforms, build-tools,
      # licenses pre-accepted). android-actions/setup-android@v3 additionally
      # tries to install the legacy "tools" package, which Google has removed
      # from the SDK repository, so it always fails now - skip it entirely.
      - name: Show pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      # This repo doesn't commit a Gradle wrapper jar, so we install and use
      # a pinned system Gradle (AGP 8.13 needs 8.13+) instead of ./gradlew. setup-gradle also
      # handles dependency caching for us.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      # Release turns on R8 (minify) and lintVital, which debug never exercises: a missing keep
      # rule or a lint error would otherwise only show up in the shipped app. Unsigned on purpose.
      - name: Assemble release (R8 + lint check)
        # No release key is configured here, so this APK is signed with the debug key (see
        # app/build.gradle.kts): installable for testing the minified build, not publishable.
        run: gradle assembleRelease --stacktrace

      - name: Verify APK output
        run: |
          echo "Files matching the artifact glob:"
          ls -la app/build/outputs/apk/debug/*.apk
          echo ""
          echo "SHA-256 (compare this against whatever you extract locally):"
          sha256sum app/build/outputs/apk/debug/*.apk
          echo ""
          echo "unzip -l summary (should look like a normal APK's internal listing):"
          unzip -l app/build/outputs/apk/debug/*.apk | tail -5

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meowlaundry-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: meowlaundry-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
